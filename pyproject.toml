[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-memex"
dynamic = ["version"]
description = "Personal health data archive: consolidate medical records from multiple EHR systems into a single queryable SQLite database"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Alexander Towell", email = "lex@metafunctor.com" },
]
keywords = ["health", "ehr", "clinical", "medical-records", "fhir", "cda", "memex", "patient"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Shared arkiv bundle pack/unpack (byte-reproducible packing, safe
    # extraction with zip/tar bomb limits).
    "arkiv>=0.4",
    "lxml",
    "pyyaml",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
dev = [
    "pytest",
    "pytest-cov",
    # Exact pins: linter, formatter, and checker output changes between
    # releases, and CI installs this extra so local and CI runs agree.
    # Bump deliberately, together with any fixes the new versions demand.
    "ruff==0.17.1",
    "mypy==2.4.0",
    "lxml-stubs==0.5.1",
    "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
health-memex = "health_memex.cli:main"

[project.urls]
# The GitHub repo was never renamed from chartfold; health-memex 404s.
Homepage = "https://github.com/queelius/chartfold"
Repository = "https://github.com/queelius/chartfold"

[tool.hatch.version]
path = "src/health_memex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/health_memex"]

# Allowlist, not hatch's default of "everything not gitignored": 2.1.0's sdist
# shipped untracked local tool state (.claude/, .serena/, .playwright-mcp/).
# A health-data package must never pick up whatever sits in the working tree.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # Pyflakes
    "B",          # flake8-bugbear (common bugs)
    "C4",         # flake8-comprehensions
    "SIM",        # flake8-simplify
    "PERF",       # Perflint performance
    "PL",         # Pylint rules
    "RUF",        # Ruff-specific
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR0917",  # Too many positional arguments (ruff's split-out sibling of PLR0913)
    "PLR2004",  # Magic value comparison
    "PLR0912",  # Too many branches (to fix in Phase 4)
    "PLR0911",  # Too many return statements
    "PLR0915",  # Too many statements
    "PLC0415",  # Import outside top-level (intentional lazy imports)
    "PERF401",  # Manual list append (often more readable)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "E501"]  # Test XML fixtures can be long
"**/__init__.py" = ["F401"]  # Re-exports are intentional
"src/health_memex/mcp/server.py" = ["E501", "PERF402"]  # MCP decorator strings; list.extend not clearer

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.coverage.run]
source = ["src/health_memex"]
branch = true
omit = ["src/health_memex/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 68
show_missing = true
